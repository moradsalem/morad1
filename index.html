<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع الشحنة - شركة تيار إنارتي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f172a;
      --accent: #d97706;
      --success: #10b981;
      --warning: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      overflow: hidden;
      text-align: center;
    }
    
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 32px 20px;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--accent);
    }
    .brand-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .brand-subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    
    .content { padding: 32px 24px; }
    
    /* حالة التحميل */
    .loading-box { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s infinite linear;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* أيقونات وشارات الحالة */
    .status-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 38px;
    }
    
    .shipped-badge { background-color: #d1fae5; color: var(--success); border: 2px solid #a7f3d0; }
    .processing-badge { background-color: #fef3c7; color: var(--warning); border: 2px solid #fde68a; }
    
    .status-title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .status-desc { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }
    
    .order-ref {
      display: inline-block;
      background: #f1f5f9;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }
    
    /* صورة سند الشحن */
    .receipt-container {
      margin-top: 20px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #f8fafc;
      position: relative;
    }
    .receipt-container img {
      width: 100%;
      height: auto;
      max-height: 380px;
      object-fit: contain;
      display: block;
      background-color: #000;
    }
    .view-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      transition: background 0.2s;
    }
    .view-btn:hover { background-color: #1e293b; }
    
    .footer {
      padding: 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="brand-title">شركة تيار إنارتي</div>
      <div class="brand-subtitle">نظام تتبع حالة طلبات الشحن</div>
    </div>

    <div class="content">
      
      <!-- شاشة جاري التحميل -->
      <div id="loadingView" class="loading-box">
        <div class="spinner"></div>
        <p style="font-weight: 700; color: #64748b;">جاري البحث عن تفاصيل الطلب...</p>
      </div>

      <!-- شاشة العرض الأساسية -->
      <div id="resultView" style="display: none;">
        
        <div id="orderRefBox" class="order-ref" style="display: none;">
          رقم الطلب: <span id="orderRefNum"></span>
        </div>

        <div id="statusBadge" class="status-badge"></div>
        
        <h2 id="statusTitle" class="status-title"></h2>
        <p id="statusDesc" class="status-desc"></p>

        <!-- صورة السند عند التوفر -->
        <div id="receiptBox" style="display: none;">
          <div class="receipt-container">
            <img id="receiptImg" src="" alt="سند الشحن">
          </div>
          <a id="fullImageLink" href="#" target="_blank" class="view-btn">
            🔍 فتح سند الشحن بحجم كامل
          </a>
        </div>

      </div>

    </div>

    <div class="footer">
      جميع الحقوق محفوظة © شركة تيار إنارتي
    </div>
  </div>

  <script>
    // الرابط الجديد الذي أرسلته
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtBxhmSd8UXaR4vVU4bVXAIf5-RltOHOGijIZVS32LFYHpQ6Ul5DFNIorpgKqaNp4/exec";

    document.addEventListener("DOMContentLoaded", function() {
      // استخراج رقم الفاتورة والعميل من رابط الصفحة
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id') || urlParams.get('ref') || "";

      const loadingView = document.getElementById('loadingView');
      const resultView = document.getElementById('resultView');
      const statusBadge = document.getElementById('statusBadge');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');
      const receiptBox = document.getElementById('receiptBox');
      const receiptImg = document.getElementById('receiptImg');
      const fullImageLink = document.getElementById('fullImageLink');
      const orderRefBox = document.getElementById('orderRefBox');
      const orderRefNum = document.getElementById('orderRefNum');

      if (orderId) {
        orderRefNum.textContent = orderId;
        orderRefBox.style.display = 'inline-block';
      }

      if (!orderId) {
        showProcessingState("لم يتم تحديد رقم الطلب بالرابط");
        return;
      }

      // جلب حالة الطلب من السيرفر
      fetch(`${SCRIPT_URL}?id=${encodeURIComponent(orderId)}`)
        .then(response => response.json())
        .then(data => {
          loadingView.style.display = 'none';
          resultView.style.display = 'block';

          if (data.status === 'shipped') {
            // حالة: تم الشحن
            statusBadge.className = 'status-badge shipped-badge';
            statusBadge.innerHTML = '✓';
            statusTitle.textContent = "تم شحن طلبكم";
            statusTitle.style.color = "#0f766e";
            statusDesc.textContent = "مرفق أدناه صورة من سند الشحن الخاص بطلبكم عبر شركة الشحن.";

            if (data.imageUrl) {
              receiptImg.src = data.imageUrl;
              fullImageLink.href = data.originalUrl || data.imageUrl;
              receiptBox.style.display = 'block';
            }
          } else {
            // حالة: طلبكم تحت التنفيذ
            showProcessingState();
          }
        })
        .catch(error => {
          console.error('Error fetching status:', error);
          showProcessingState();
        });

      function showProcessingState(customMsg) {
        loadingView.style.display = 'none';
        resultView.style.display = 'block';

        statusBadge.className = 'status-badge processing-badge';
        statusBadge.innerHTML = '⏳';
        statusTitle.textContent = "طلبكم تحت التنفيذ";
        statusTitle.style.color = "#d97706";
        statusDesc.textContent = customMsg || "طلبكم قيد التحضير والتجهيز حالياً، وسيتم إضافة سند الشحن فور تسليمه للشركة.";
        receiptBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>
